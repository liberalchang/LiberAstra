name: minimax_h3_t2v_uncensored
capability: t2v
description: 'MiniMax H3 文生视频（越狱版，NVFP4）

  输入画面与动作描述，直接生成带同步音效的短视频，无需首帧图。可选 EMA Turbo 加速。'
fps: 24
inputs:
  prompt:
    node: 105:104
    field: inputs.prompt
    type: str
    required: true
    label: 提示词
    description: 描述镜头、运动、对白与音效；可写分镜时间轴。提示词原样进入生成（无增强器）
  width:
    node: 105:104
    field: inputs.width
    type: int
    default: 1344
    min: 512
    max: 1920
    multiple: 32
  height:
    node: 105:104
    field: inputs.height
    type: int
    default: 768
    min: 512
    max: 1920
    multiple: 32
  length:
    node: 105:104
    field: inputs.length
    type: int
    default: 124
    min: 73
    max: 362
    align_base: 17
    align_offset: 5
    label: 帧数
  seed:
    node: '105:15'
    field: inputs.noise_seed
    type: int
    default: -1
    description: 随机种子。-1 表示每次随机。
  steps:
    node: '105:9'
    field: inputs.steps
    type: int
    default: 20
    min: 4
    max: 50
    description: 采样步数。这个包默认 20 步。
  sampler_name:
    node: '105:17'
    field: inputs.sampler_name
    type: str
    default: res_multistep
    label: 采样器
    description: 采样器。官方示例是 res_multistep，一般不用改。
  clip_name:
    node: '105:13'
    field: inputs.clip_name
    type: str
    default: qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors
    options_from: text_encoders
    label: 文本编码器（越狱）
    description: 默认 heretic NVFP4；也可换成 INT8 越狱或官方 TE（type 仍为 minimax）
  unet_name:
    node: '105:6'
    field: inputs.unet_name
    type: str
    default: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（FL2VA）
    description: 主模型。须与文本编码器同属 MiniMax H3。
outputs:
  node: '92'
  key: images
accel:
  label: Turbo 加速
  family: minimax_h3
  default_enabled: false
  node: 105:200
  bypass_input: model
  lora:
    field: inputs.lora_name
    options_from: loras
    match: _ema
    recommended: minimax_h3_turbo_v4_step600_ema.safetensors
  strength:
    field: inputs.strength
    default: 1.0
    min: 0.5
    max: 1.5
  preset:
    steps: 8
    sampler_name: euler
requirements:
  nodes:
  - MiniMaxH3ImageToVideo
  - MiniMaxH3TurboLoRA
  - SamplerCustomAdvanced
  - SaveVideo
  - CreateVideo
  models:
  - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - text_encoders/qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors
  - vae/minimax_h3_video_vae_fp16.safetensors
  - vae/minimax_h3_audio_vae_fp32.safetensors
  - loras/minimax_h3_turbo_v4_step600_ema.safetensors
llm_note: '事实:MiniMax H3 文生视频,越狱 NVFP4 TE(无内容审查层);无首帧;带同步音效;可选 EMA Turbo LoRA。

  写作指导:主体/环境/镜头/动作/音效写全;允许成人/敏感题材。'
