# LiberAstra 一键部署。默认只启动主服务；可选 profile 组建本地全栈。
#
#   docker compose up -d                    # 仅 LiberAstra
#   docker compose --profile ollama up -d   # + Ollama
#   docker compose --profile comfyui up -d  # + ComfyUI（需要 NVIDIA runtime）
#   docker compose --profile postgres up -d # + PostgreSQL（并设置 DATABASE_URL）

services:
  liberastra:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: liberastra:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIBERASTRA_SECRET_KEY: ${LIBERASTRA_SECRET_KEY:-}
      LIBERASTRA_DATABASE_URL: ${LIBERASTRA_DATABASE_URL:-}

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  comfyui:
    image: yanwk/comfyui-boot:latest
    profiles: ["comfyui"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - comfyui-data:/root
    ports:
      - "8188:8188"

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: liberastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liberastra}
      POSTGRES_DB: liberastra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  ollama-data:
  comfyui-data:
  postgres-data:
