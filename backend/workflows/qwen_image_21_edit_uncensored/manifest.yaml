name: qwen_image_21_edit_uncensored
capability: i2i
description: 'Qwen-Image 2.1 整图编辑（越狱版，UC INT8）

  上传 1 张图，写清要改什么，得到编辑后的图。可开关 Uncensored LoRA。'
inputs:
  image:
    node: '10'
    field: inputs.image
    type: image
    required: true
    description: 要修改的那一张图
    label: 原图
  unet_name:
    node: '1'
    field: inputs.unet_name
    type: str
    default: qwen-image-2.1-UC-int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（UNET）
    description: 默认越狱 UC-int8_convrot。可改回官方 int8 或 bf16，越狱效果会变弱。须为 safetensors。
  clip_name:
    node: '2'
    field: inputs.clip_name
    type: str
    default: qwen3vl_8b_int8_convrot.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: Qwen-Image 用 qwen3vl_8b，CLIPLoader 的 type 保持 qwen_image。
  vae_name:
    node: '3'
    field: inputs.vae_name
    type: str
    default: qwen_image_2.1_vae_bf16.safetensors
    options_from: vae
    label: VAE
    description: Qwen-Image 的 VAE。不要换成 FLUX 或 MiniMax 的 VAE。
  prompt:
    node: '5'
    field: inputs.prompt
    type: str
    required: true
    description: 编辑指令，例如把背景换成海滩，人脸和姿势保持不变
  negative_prompt:
    node: '5'
    field: inputs.negative_prompt
    type: str
    default: ''
    description: 不希望出现的内容，可以留空。
  resolution:
    node: '5'
    field: inputs.resolution
    type: int
    default: 1024
    min: 0
    max: 4096
    description: 参考图缩放到大约这个边长，须为 32 的倍数。0 表示按原图尺寸
  steps:
    node: '6'
    field: inputs.steps
    type: int
    default: 25
    min: 1
    max: 50
    description: 采样步数。这个包默认 25 步。
  seed:
    node: '6'
    field: inputs.seed
    type: int
    default: -1
    description: 随机种子。-1 表示每次随机。
outputs:
  node: '8'
  key: images
accel:
  label: Uncensored LoRA
  family: qwen_image
  hint: 开启后把 UC LoRA 挂到主模型上；关闭则只用 UC UNET
  hint_off: 关闭时从图中摘掉 LoRA 节点
  lora_label: LoRA 文件
  strength_label: LoRA 强度
  default_enabled: true
  node: '200'
  bypass_input: model
  lora:
    field: inputs.lora_name
    options_from: loras
    match: uncensored
    recommended: qwen-image-2.1-uncensored-lora.safetensors
  strength:
    field: inputs.strength_model
    default: 1.0
    min: 0.0
    max: 1.5
requirements:
  nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - QwenImage21Cache
  - LoraLoaderModelOnly
  - LoadImage
  - TextEncodeQwenImage21
  - KSampler
  - VAEDecode
  - SaveImage
  models:
  - diffusion_models/qwen-image-2.1-UC-int8_convrot.safetensors
  - text_encoders/qwen3vl_8b_int8_convrot.safetensors
  - vae/qwen_image_2.1_vae_bf16.safetensors
  - loras/qwen-image-2.1-uncensored-lora.safetensors
llm_note: '事实:Qwen-Image 2.1 整图编辑,越狱 UC INT8(无内容审查层);Uncensored LoRA 可开关;TE/VAE 与官方共用。

  写作指导:写清改动与保持项;允许成人/敏感题材。'
