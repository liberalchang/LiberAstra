# 基于 MiniMax H3 FL2VA + MiniMaxH3AddGuide 的数字人口播工作流包：
# 首帧锚定人物肖像（MiniMaxH3ImageToVideo），第 0 帧锚定 TTS 语音潜变量（MiniMaxH3AddGuide），
# 由音画联合 DiT 同步生成说话口型与面部动作，并在成片中直接封装清晰 TTS 原声。
name: minimax_h3_avatar
capability: avatar
description: MiniMax H3 数字人口播（首帧人物 + MiniMaxH3AddGuide 语音锚定驱动口型；官方 TE；可选 Turbo LoRA）
fps: 24
inputs:
  image:
    node: "114"
    field: inputs.image
    type: image
    required: true
    label: 人物图片
  audio:
    node: "115"
    field: inputs.audio
    type: audio
    required: true
    label: 口播音频
  prompt:
    node: "105:104"
    field: inputs.prompt
    type: str
    required: true
    label: 提示词
    description: 画面动作与说话状态描述；留空时自动按口播文案构造说话提示词
  width:
    node: "105:104"
    field: inputs.width
    type: int
    default: 768
    min: 512
    max: 1920
    multiple: 32
  height:
    node: "105:104"
    field: inputs.height
    type: int
    default: 1344
    min: 512
    max: 1920
    multiple: 32
  length:
    node: "105:104"
    field: inputs.length
    type: int
    default: 124
    min: 73
    max: 362
    align_base: 17
    align_offset: 5
    label: 帧数
  seed:
    node: "105:15"
    field: inputs.noise_seed
    type: int
    default: -1
  steps:
    node: "105:9"
    field: inputs.steps
    type: int
    default: 20
    min: 4
    max: 50
  sampler_name:
    node: "105:17"
    field: inputs.sampler_name
    type: str
    default: res_multistep
    label: 采样器
  clip_name:
    node: "105:13"
    field: inputs.clip_name
    type: str
    default: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: 官方 TE；可换成越狱版同族文件（type 仍为 minimax）
  unet_name:
    node: "105:6"
    field: inputs.unet_name
    type: str
    default: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（FL2VA）
outputs:
  node: "92"
  key: images
accel:
  label: Turbo 加速
  family: minimax_h3
  default_enabled: false
  node: "105:200"
  bypass_input: model
  lora:
    field: inputs.lora_name
    options_from: loras
    match: _ema
    recommended: minimax_h3_turbo_v4_step600_ema.safetensors
  strength:
    field: inputs.strength
    default: 1.0
    min: 0.5
    max: 1.5
  preset:
    steps: 8
    sampler_name: euler
requirements:
  nodes:
    - LoadImage
    - LoadAudio
    - MiniMaxH3ImageToVideo
    - MiniMaxH3AddGuide
    - MiniMaxH3TurboLoRA
    - SamplerCustomAdvanced
    - SaveVideo
    - CreateVideo
  models:
    - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    - text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    - vae/minimax_h3_video_vae_fp16.safetensors
    - vae/minimax_h3_audio_vae_fp32.safetensors
    - loras/minimax_h3_turbo_v4_step600_ema.safetensors
