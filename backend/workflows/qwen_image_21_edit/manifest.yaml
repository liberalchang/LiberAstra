name: qwen_image_21_edit
capability: i2i
description: 'Qwen-Image 2.1 整图编辑（官方版，INT8）

  上传 1 张图，写清要改什么，得到编辑后的图。参数区可换模型三件套（如越狱 UC 版）；请选 .safetensors 格式。'
inputs:
  image:
    node: '10'
    field: inputs.image
    type: image
    required: true
    description: 要修改的那一张图
    label: 原图
  unet_name:
    node: '1'
    field: inputs.unet_name
    type: str
    default: qwen_image_2.1_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（UNET）
    description: '默认官方 int8_convrot。可换 bf16 或越狱 UC（如 qwen-image-2.1-UC-int8_convrot.safetensors）。
      须为 safetensors。

      '
  clip_name:
    node: '2'
    field: inputs.clip_name
    type: str
    default: qwen3vl_8b_int8_convrot.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: Qwen-Image 用 qwen3vl_8b；CLIPLoader type 保持 qwen_image
  vae_name:
    node: '3'
    field: inputs.vae_name
    type: str
    default: qwen_image_2.1_vae_bf16.safetensors
    options_from: vae
    label: VAE
    description: Qwen-Image 的 VAE。不要换成 FLUX 或 MiniMax 的 VAE。
  prompt:
    node: '5'
    field: inputs.prompt
    type: str
    required: true
    description: 编辑指令，例如把背景换成海滩，人脸和姿势保持不变
  negative_prompt:
    node: '5'
    field: inputs.negative_prompt
    type: str
    default: ''
    description: 不希望出现的内容，可以留空。
  resolution:
    node: '5'
    field: inputs.resolution
    type: int
    default: 1024
    min: 0
    max: 4096
    description: 参考图缩放到大约这个边长，须为 32 的倍数。0 表示按原图尺寸
  steps:
    node: '6'
    field: inputs.steps
    type: int
    default: 25
    min: 1
    max: 50
    description: 采样步数。这个包默认 25 步。
  seed:
    node: '6'
    field: inputs.seed
    type: int
    default: -1
    description: 随机种子。-1 表示每次随机。
outputs:
  node: '8'
  key: images
requirements:
  nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - QwenImage21Cache
  - LoadImage
  - TextEncodeQwenImage21
  - KSampler
  - VAEDecode
  - SaveImage
llm_note: '事实:Qwen-Image 2.1 整图编辑;原图进入 TextEncodeQwenImage21 的 image_1,采样用该节点返回的 latent;官方
  INT8。

  写作指导:写清「要改成什么」与「必须保持不变什么(人脸、姿势、构图主体、风格)」。'
