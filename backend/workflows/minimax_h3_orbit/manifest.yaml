name: minimax_h3_orbit
capability: i2v
description: 'MiniMax H3 360° 环绕

  一张图时，首帧会同时作为尾帧，镜头绕一圈回到起点。再传一张结束画面时，尾帧改用第二张，适合环绕过程中换装。提示词留空使用作者原句。'
fps: 24
inputs:
  image:
    node: '114'
    field: inputs.image
    type: image
    required: true
    label: 首帧图片
    description: 环绕的起点。只传这一张时，结束画面自动用同一张，镜头绕回起点。
  image_2:
    node: '115'
    field: inputs.image
    type: image
    required: false
    fallback: image
    label: 结束画面
    description: 可选。不传则与首帧同一张。传入另一张后，环绕结束在这张画面上。
  prompt:
    node: 105:104
    field: inputs.prompt
    type: str
    required: false
    label: 提示词
    description: 留空使用 360° 环绕原句。两张不同的图且提示词仍是原句时，自动加上换装句。自定义提示词不会被改写。
    default: |-
      One frozen instant. Only the camera moves. In a continuous 360 orbit. Preserve every person and object in exactly the same world position, orientation, shape and pose throughout the shot. Airborne objects remain suspended at the captured height and angle: no wobbling, shaking, spinning, drifting, falling or continued action. Keep faces, hands, clothing, liquids and the background motionless while retaining their natural appearance. Camera parallax is the only source of apparent movement. No cuts, zoom, morphing or added objects.
    distinct_image_2: |-
      One frozen instant. Only the camera moves. In a continuous 360 orbit. Preserve every person and object in exactly the same world position, orientation, shape and pose throughout the shot. Airborne objects remain suspended at the captured height and angle: no wobbling, shaking, spinning, drifting, falling or continued action. Keep faces, hands, clothing, liquids and the background motionless while retaining their natural appearance. Camera parallax is the only source of apparent movement. No cuts, zoom, morphing or added objects. The outfit gradually changes during the orbit.
  width:
    node: 105:104
    field: inputs.width
    type: int
    default: 768
    min: 512
    max: 1920
    multiple: 32
  height:
    node: 105:104
    field: inputs.height
    type: int
    default: 768
    min: 512
    max: 1920
    multiple: 32
  length:
    node: 105:104
    field: inputs.length
    type: int
    default: 73
    min: 73
    max: 362
    align_base: 17
    align_offset: 5
    label: 帧数
    description: 作者验证过的长度是 73 帧（约 3 秒）。更长未在这套 LoRA 上验证。
  seed:
    node: '105:15'
    field: inputs.noise_seed
    type: int
    default: -1
  steps:
    node: '105:9'
    field: inputs.steps
    type: int
    default: 28
    min: 4
    max: 50
    label: 步数
  sampler_name:
    node: '105:17'
    field: inputs.sampler_name
    type: str
    default: res_multistep
    label: 采样器
  lora_name:
    node: '116'
    field: inputs.lora_name
    type: str
    default: minimax_h3_flf2v_lora_v1.safetensors
    options_from: loras
    label: 环绕 LoRA
  lora_strength:
    node: '116'
    field: inputs.strength_model
    type: float
    default: 1.0
    min: 0
    max: 2
    label: LoRA 强度
  clip_name:
    node: '105:13'
    field: inputs.clip_name
    type: str
    default: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    options_from: text_encoders
    label: 文本编码器
  unet_name:
    node: '105:6'
    field: inputs.unet_name
    type: str
    default: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（FL2VA）
  vae_name:
    node: '105:11'
    field: inputs.vae_name
    type: str
    default: minimax_h3_video_vae_int8_convrot.safetensors
    options_from: vae
    label: 视频 VAE
    description: 文章用的 int8。若解码发黑，改成 minimax_h3_video_vae_fp16.safetensors。
outputs:
  node: '92'
  key: images
requirements:
  nodes:
  - MiniMaxH3ImageToVideo
  - LoraLoaderModelOnly
  - SamplerCustomAdvanced
  - SaveVideo
  - CreateVideo
  models:
  - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  - vae/minimax_h3_video_vae_int8_convrot.safetensors
  - vae/minimax_h3_audio_vae_fp32.safetensors
  - loras/minimax_h3_flf2v_lora_v1.safetensors
llm_note: '事实:MiniMax H3 360° 环绕 LoRA。首尾帧都要接上；只给一张图时尾帧必须是同一张，否则镜头回不到起点。只给首帧时基座会漂走。两张图相同且没有这枚 LoRA 时画面几乎不动。作者设定 768×768、73 帧、28 步、LoRA 强度 1.0，无 CFG、无负面提示词。

  写作指导:用户没写提示词时保持作者原句，不要改写成普通运镜。两张图路径不同且用户仍用原句时，句末加 The outfit gradually changes during the orbit. 用户已经自定义提示词时原样保留。'
