name: minimax_h3_motion
capability: motion
description: 'MiniMax H3 动作迁移（官方版）

  给一张人物图和一段参考视频，让人物做出视频里的动作，生成新视频。提示词里用 <Picture 1> 指人物图、<Video 1> 指参考视频。单段最长约 5 秒，动作别写太满。可选
  Turbo 加速。'
fps: 24
inputs:
  video:
    node: '115'
    field: inputs.video
    type: video
    required: true
    label: 参考视频
    mention: "<Video 1>"
  image:
    node: '114'
    field: inputs.image
    type: image
    required: true
    label: 目标图片
    mention: "<Picture 1>"
  image_2:
    node: '116'
    field: inputs.image
    type: image
    required: false
    label: 侧面参考
    mention: "<Picture 2>"
    description: 可选。角色库会把侧面单人图放在这里，对应 <Picture 2>
  image_3:
    node: '117'
    field: inputs.image
    type: image
    required: false
    label: 背面参考
    mention: "<Picture 3>"
    description: 可选。角色库会把背面单人图放在这里，对应 <Picture 3>
  prompt:
    node: 105:104
    field: inputs.prompt
    type: str
    required: true
    label: 提示词
    description: 用「目标图片」指人物、「参考视频」指动作；留空时自动补齐动作迁移指令
  width:
    node: 105:104
    field: inputs.width
    type: int
    default: 768
    min: 512
    max: 1920
    multiple: 32
  height:
    node: 105:104
    field: inputs.height
    type: int
    default: 1344
    min: 512
    max: 1920
    multiple: 32
  length:
    node: 105:104
    field: inputs.length
    type: int
    default: 124
    min: 73
    max: 124
    align_base: 17
    align_offset: 5
    label: 帧数
  seed:
    node: '105:15'
    field: inputs.noise_seed
    type: int
    default: -1
  steps:
    node: '105:9'
    field: inputs.steps
    type: int
    default: 20
    min: 4
    max: 50
  sampler_name:
    node: '105:17'
    field: inputs.sampler_name
    type: str
    default: res_multistep
    label: 采样器
  clip_name:
    node: '105:13'
    field: inputs.clip_name
    type: str
    default: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: 官方 TE；可换成越狱版同族文件（type 仍为 minimax）
  unet_name:
    node: '105:6'
    field: inputs.unet_name
    type: str
    default: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（FL2VA）
outputs:
  node: '92'
  key: images
accel:
  label: Turbo 加速
  family: minimax_h3
  default_enabled: false
  node: 105:200
  bypass_input: model
  lora:
    field: inputs.lora_name
    options_from: loras
    match: _ema
    recommended: minimax_h3_turbo_v4_step600_ema.safetensors
  strength:
    field: inputs.strength
    default: 1.0
    min: 0.5
    max: 1.5
  preset:
    steps: 8
    sampler_name: euler
requirements:
  nodes:
  - LoadImage
  - VHS_LoadVideo
  - MiniMaxH3ReferenceToVideo
  - MiniMaxH3TurboLoRA
  - SamplerCustomAdvanced
  - SaveVideo
  - CreateVideo
  models:
  - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  - vae/minimax_h3_video_vae_fp16.safetensors
  - vae/minimax_h3_audio_vae_fp32.safetensors
  - loras/minimax_h3_turbo_v4_step600_ema.safetensors
llm_note: '事实:MiniMax H3 动作迁移;MiniMaxH3ReferenceToVideo 多模态参考,<Picture 1> 锁定人物身份、<Video
  1> 迁移其动作;官方 TE;单段上限 124 帧(24fps ≈ 5.2 秒);可选 Turbo LoRA。

  写作指导:动作幅度与时序必须在约 5 秒内合理;写清「人物保持图中形象,动作来自参考视频」,不要写与参考视频矛盾的剧情。'
