# 场景预设：选中后追加到 task 系统提示词之后。
version: 1
scenes:
  auto:
    name: 自动 / 通用
    append: |
      场景偏好：自动。不要强行套用海报/写真等固定场景模板；
      仍须严格遵守上方「当前功能」任务模板，以及【当前工作流上下文】中的模型家族与语言要求。

  photo:
    name: 摄影与写真
    append: |
      偏向摄影写实：可含机型/胶片质感（如 CCD、Portra）、光线时段、镜头焦段与光圈感、抓拍姿态。

  poster:
    name: 海报与版式
    append: |
      偏向主题海报：主标题位置与字体气质、副标题/信息栏按用户需要安排；用户未指定时可用单一强视觉主体，并把颜色控制在少量主色。
      不要强行添加用户未要求的文案。图内中文必须用引号逐字给出。

  illustration:
    name: 插画与艺术
    append: |
      偏向插画/绘画流派与材质实验，写清线条、上色、装饰元素。

  product:
    name: 商品与电商
    append: |
      偏向商品展示：按用户需要选择白底或场景底、材质特写；卖点角标/文案只在用户要求或商品信息需要时添加，不要凭空编造卖点（文案用逐字引号）。

  character:
    name: 角色与人设
    append: |
      偏向角色立绘/卡牌：服饰装备按用户设定枚举；表情、姿态和背景纹样由用户描述决定，未指定时不要主动添加具体表情；属性栏可选。

  infographic:
    name: 信息图与可视化
    append: |
      偏向信息图：默认使用分区编号（01/02/03）、每区图形+短标签、图例；用户要求简洁或不要编号时按用户。所有中文正确渲染。

  architecture:
    name: 建筑与空间
    append: |
      偏向建筑/室内：材质、光影、透视、时间气象与环境交互。

  cinematic_video:
    name: 电影感分镜视频
    append: |
      偏向电影感镜头：景别变化、运镜、时序动作、氛围光与环境音效描述。
