name: qwen_image_21_union_reference
capability: i2i
description: 'Qwen-Image 2.1 Fun ControlNet Union：第 1 张人物照保持身份，第 2 张深度图（或姿态图）决定动作。

  来自 T8 qwen21_union_pose_reference_edit。人物照决定画布。控制类型默认 Depth；火柴人骨架改成 Pose。需安装节点 qwen-image-2-1-fun-controlnet-union-t8，ComfyUI ≥ 0.37。Union 权重放 controlnet/。'
inputs:
  image:
    node: '14'
    field: inputs.image
    type: image
    required: true
    label: 人物照
    description: 要保留脸、发型和服装的人。决定输出画布比例
  image_2:
    node: '5'
    field: inputs.image
    type: image
    required: true
    label: 深度图
    description: 目标动作的深度图。与人物照使用同一宽高比更稳。若是 OpenPose 骨架，把控制类型改成 Pose
  unet_name:
    node: '1'
    field: inputs.unet_name
    type: str
    default: qwen-image-2.1-UC-int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（UNET）
    description: 默认越狱 UC-int8_convrot。可改回官方 int8/bf16，但越狱效果会变弱。须为 safetensors
  clip_name:
    node: '2'
    field: inputs.clip_name
    type: str
    default: qwen3vl_8b_int8_convrot.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: Qwen-Image 用 qwen3vl_8b；CLIPLoader type 保持 qwen_image
  vae_name:
    node: '3'
    field: inputs.vae_name
    type: str
    default: qwen_image_2.1_vae_bf16.safetensors
    options_from: vae
    label: VAE
    description: Qwen-Image 的 VAE。不要换成 FLUX 或 MiniMax 的 VAE。
  union_model:
    node: '4'
    field: inputs.union_model
    type: str
    default: Qwen-Image-2.1-Fun-Controlnet-Union-ComfyUI.safetensors
    options_from: controlnet
    label: Union 控制模型
    description: T8 转换的 Fun ControlNet Union。文件名须以 Qwen-Image-2.1-Fun-Controlnet-Union 开头，放在 controlnet/
  prompt:
    node: '6'
    field: inputs.prompt
    type: str
    default: Edit the reference image so the person keeps the same face, hair and clothing, and matches the pose of the control image.
    label: 提示词
    description: 写要保住的身份，以及动作以外还要改的内容。留空使用默认句
  negative_prompt:
    node: '6'
    field: inputs.negative_prompt
    type: str
    default: ''
    label: 负面提示词
    description: 不希望出现的内容，可以留空。
  control_mode:
    node: '7'
    field: inputs.control_mode
    type: str
    default: Depth
    options:
    - Canny
    - Depth
    - Grayscale
    - HED
    - Lineart
    - MLSD
    - Pose
    - Scribble
    label: 控制类型
    description: 深度图用 Depth，OpenPose 骨架用 Pose。下拉只标注类型，模型按像素读取
  strength:
    node: '7'
    field: inputs.strength
    type: float
    default: 1.0
    min: 0
    max: 2
    label: 控制强度
    description: 脸被带偏时降到 0.7–0.8
  start_percent:
    node: '7'
    field: inputs.start_percent
    type: float
    default: 0
    min: 0
    max: 1
    label: 控制起始
    description: 从采样的这一比例开始使用控制图。0 表示一上来就跟。
  end_percent:
    node: '7'
    field: inputs.end_percent
    type: float
    default: 1
    min: 0
    max: 1
    label: 控制结束
    description: 到采样的这一比例结束控制。1 表示一直跟到结束。
  resolution:
    node: '6'
    field: inputs.resolution
    type: int
    default: 1024
    min: 0
    max: 4096
    description: 参考图缩放到大约这个边长，须为 32 的倍数。0 表示按原图尺寸
  steps:
    node: '8'
    field: inputs.steps
    type: int
    default: 40
    min: 1
    max: 50
    description: T8 示例为 40 步。CFG 固定为 1
  seed:
    node: '8'
    field: inputs.seed
    type: int
    default: -1
    description: 随机种子。-1 表示每次随机。
outputs:
  node: '10'
  key: images
requirements:
  nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - QwenImage21UnionLoader
  - LoadImage
  - QwenImage21UnionReferenceEncode
  - QwenImage21UnionApply
  - KSampler
  - VAEDecode
  - SaveImage
  models:
  - diffusion_models/qwen-image-2.1-UC-int8_convrot.safetensors
  - text_encoders/qwen3vl_8b_int8_convrot.safetensors
  - vae/qwen_image_2.1_vae_bf16.safetensors
  - controlnet/Qwen-Image-2.1-Fun-Controlnet-Union-ComfyUI.safetensors
llm_note: '事实:Qwen-Image 2.1 Fun ControlNet Union 参考图编辑。第 1 张人物照进入 QwenImage21UnionReferenceEncode，决定画布和身份；第 2 张是深度图或姿态控制图。采样 latent 必须来自参考编码节点。CFG 固定为 1，默认 40 步。

  写作指导:写明保持脸、发型和服装，动作交给控制图。不要把第二张深度图写成另一个人。'
