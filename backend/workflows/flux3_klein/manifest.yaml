name: flux3_klein
capability: t2i
description: 'FLUX.3 Klein 文生图（蒸馏版，INT8）

  输入画面描述，生成一张图片。自带提示词扩展器（默认开），会把短描述自动扩写成长描述。官方推荐 16 步，页面可改。'
inputs:
  unet_name:
    node: '18:1'
    field: inputs.unet_name
    type: str
    default: flux3-image-klein-int8-convrot.safetensors
    options_from: diffusion_models
    label: 主模型（UNET）
    description: 蒸馏 INT8。24GB 不要选 bf16（约 11GB）或 NVFP4（3090 不能跑）。
  clip_name:
    node: '18:2'
    field: inputs.clip_name
    type: str
    default: qwen3vl_4b_int8_convrot.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: 图像用的 Qwen3-VL-4B。CLIPLoader type 保持 flux3，不要选 Qwen-Image 的 8B。
  upsampler_name:
    node: '18:12'
    field: inputs.clip_name
    type: str
    default: qwen3.5_9b_flux3_prompt_upsampler_w4a8.safetensors
    options_from: text_encoders
    label: 提示词扩展器
    description: 把短提示词扩成英文长描述。官方要求不要关掉这条链路裸跑。
  vae_name:
    node: '18:3'
    field: inputs.vae_name
    type: str
    default: flux2-vae.safetensors
    options_from: vae
    label: VAE
    description: FLUX.2 的 flux2-vae，不要用 Qwen 或 MiniMax 的 VAE。
  prompt:
    node: '18:17'
    field: inputs.value
    type: str
    required: true
    description: 写主体、光线和构图即可。扩展器会把短句扩成英文长描述。
  negative_prompt:
    node: '18:5'
    field: inputs.text
    type: str
    default: ''
    label: 负面提示词
    description: 不希望出现的内容，可以留空。
  width:
    node: '18:6'
    field: inputs.width
    type: int
    default: 1024
    min: 256
    max: 1536
    description: 官方默认 1024。24GB 不要开到 4K。
  height:
    node: '18:6'
    field: inputs.height
    type: int
    default: 1024
    min: 256
    max: 1536
  steps:
    node: '18:7'
    field: inputs.steps
    type: int
    default: 16
    min: 1
    max: 32
    description: 蒸馏版官方 16 步。页面上的步数会覆盖这个默认值，建议保持 16。
  seed:
    node: '18:7'
    field: inputs.seed
    type: int
    default: -1
    description: 随机种子。-1 表示每次随机。
  batch_size:
    node: '18:6'
    field: inputs.batch_size
    type: int
    default: 1
    min: 1
    max: 4
    description: 同一次采样的张数。扩展器会占显存，24GB 建议保持 1。
outputs:
  node: '9'
  key: images
requirements:
  nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - TextGenerate
  - PrimitiveStringMultiline
  - ComfySwitchNode
  - CLIPTextEncode
  - EmptyFlux2LatentImage
  - KSampler
  - VAEDecode
  - SaveImage
  models:
  - diffusion_models/flux3-image-klein-int8-convrot.safetensors
  - text_encoders/qwen3vl_4b_int8_convrot.safetensors
  - text_encoders/qwen3.5_9b_flux3_prompt_upsampler_w4a8.safetensors
  - vae/flux2-vae.safetensors
llm_note: '事实:FLUX.3 Klein 蒸馏文生图;采样固定 CFG 1/euler/simple/官方 16 步;INT8 UNET + Qwen3-VL-4B
  INT8 文本编码器 + FLUX.2 VAE;内置 Qwen3.5 9B 提示词扩展器且默认开。

  写作指导:生成时扩展器还会二次扩写——提示词保持中等长度、主体/光线/构图要素准确即可,不要堆超长枚举,避免双重膨胀跑题。'
