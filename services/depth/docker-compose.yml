# 把这个目录拷到局域网显卡主机上单独启动：
#   docker compose up -d --build
# LiberAstra 里添加 Provider「Liber Depth API」，Base URL 填 http://<显卡主机IP>:5556

services:
  liber-depth:
    build: .
    image: liberastra-depth:latest
    restart: unless-stopped
    ports:
      - "5556:5556"
    environment:
      LIBER_DEPTH_DEVICE: ${LIBER_DEPTH_DEVICE:-cuda}
      LIBER_DEPTH_API_KEY: ${LIBER_DEPTH_API_KEY:-}
      LIBER_DEPTH_MODEL: ${LIBER_DEPTH_MODEL:-dpt_swin2_large_384}
    volumes:
      - ${LIBER_DEPTH_MODELS_DIR:-depth-models}:/models
      - depth-results:/data/results
      - ./server.py:/app/server.py:ro
      - ./engine.py:/app/engine.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  depth-models:
  depth-results:
