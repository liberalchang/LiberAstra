name: qwen_image_21_inpaint_uncensored
capability: i2i
description: 'Qwen-Image 2.1 局部重绘（越狱版，UC INT8）

  蒙版白色区域重画，黑色区域保持原样。可开关 Uncensored LoRA。'
inputs:
  image:
    node: '10'
    field: inputs.image
    type: image
    required: true
    description: 原图，第 1 张上传
  mask:
    node: '11'
    field: inputs.image
    type: image
    required: true
    description: 蒙版，第 2 张上传。白色重画，黑色保留
  unet_name:
    node: '1'
    field: inputs.unet_name
    type: str
    default: qwen-image-2.1-UC-int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（UNET）
  clip_name:
    node: '2'
    field: inputs.clip_name
    type: str
    default: qwen3vl_8b_int8_convrot.safetensors
    options_from: text_encoders
    label: 文本编码器
  vae_name:
    node: '3'
    field: inputs.vae_name
    type: str
    default: qwen_image_2.1_vae_bf16.safetensors
    options_from: vae
    label: VAE
  prompt:
    node: '5'
    field: inputs.prompt
    type: str
    required: true
    description: 白色区域里要变成什么，并写明要保持的脸和姿势
  negative_prompt:
    node: '5'
    field: inputs.negative_prompt
    type: str
    default: ''
  resolution:
    node: '5'
    field: inputs.resolution
    type: int
    default: 0
    min: 0
    max: 4096
  grow:
    node: '15'
    field: inputs.expand
    type: int
    default: 12
    min: 0
    max: 256
  steps:
    node: '6'
    field: inputs.steps
    type: int
    default: 20
    min: 1
    max: 50
  seed:
    node: '6'
    field: inputs.seed
    type: int
    default: -1
outputs:
  node: '8'
  key: images
accel:
  label: Uncensored LoRA
  family: qwen_image
  hint: 开启后把 UC LoRA 挂到主模型上；关闭则只用 UC UNET
  hint_off: 关闭时从图中摘掉 LoRA 节点
  lora_label: LoRA 文件
  strength_label: LoRA 强度
  default_enabled: true
  node: '200'
  bypass_input: model
  lora:
    field: inputs.lora_name
    options_from: loras
    match: uncensored
    recommended: qwen-image-2.1-uncensored-lora.safetensors
  strength:
    field: inputs.strength_model
    default: 1.0
    min: 0.0
    max: 1.5
requirements:
  nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - QwenImage21Cache
  - LoraLoaderModelOnly
  - LoadImage
  - GetImageSize
  - ImageScale
  - ImageToMask
  - GrowMask
  - FeatherMask
  - VAEEncode
  - SetLatentNoiseMask
  - TextEncodeQwenImage21
  - KSampler
  - VAEDecode
  - SaveImage
  models:
  - diffusion_models/qwen-image-2.1-UC-int8_convrot.safetensors
  - text_encoders/qwen3vl_8b_int8_convrot.safetensors
  - vae/qwen_image_2.1_vae_bf16.safetensors
  - loras/qwen-image-2.1-uncensored-lora.safetensors
llm_note: Qwen-Image 2.1 局部重绘（越狱）。默认 UC INT8；「Uncensored LoRA」可开关。 蒙版白区重画、黑区保留。TE/VAE
  与官方共用。
