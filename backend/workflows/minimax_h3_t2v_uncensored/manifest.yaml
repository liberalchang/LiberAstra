# 由本地 Comfy 画布【文生视频】video_minimax_h3_t2v.json 整理：
# 越狱 NVFP4 TE + LightX2V 8-step Turbo；无提示词增强；适配 LiberAstra accel（非图内 Switch）。
name: minimax_h3_t2v_uncensored
capability: t2v
description: MiniMax H3 文生视频（越狱 NVFP4 TE；无增强器；默认 LightX2V 8 步 Turbo LoRA；输出带同步音效）
fps: 24
inputs:
  prompt:
    node: "105:104"
    field: inputs.prompt
    type: str
    required: true
    label: 提示词
    description: 描述镜头、运动、对白与音效；可写分镜时间轴。提示词原样进入生成（无增强器）
  width:
    node: "105:104"
    field: inputs.width
    type: int
    default: 1344
    min: 512
    max: 1920
    multiple: 32
  height:
    node: "105:104"
    field: inputs.height
    type: int
    default: 768
    min: 512
    max: 1920
    multiple: 32
  length:
    node: "105:104"
    field: inputs.length
    type: int
    default: 124
    min: 73
    max: 362
    align_base: 17
    align_offset: 5
    label: 帧数
  seed:
    node: "105:15"
    field: inputs.noise_seed
    type: int
    default: -1
  steps:
    node: "105:9"
    field: inputs.steps
    type: int
    default: 20
    min: 4
    max: 50
  sampler_name:
    node: "105:17"
    field: inputs.sampler_name
    type: str
    default: res_multistep
    label: 采样器
  clip_name:
    node: "105:13"
    field: inputs.clip_name
    type: str
    default: qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors
    options_from: text_encoders
    label: 文本编码器（越狱）
    description: 默认 heretic NVFP4；也可换成 INT8 越狱或官方 TE（type 仍为 minimax）
  unet_name:
    node: "105:6"
    field: inputs.unet_name
    type: str
    default: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（FL2VA）
outputs:
  node: "92"
  key: images
accel:
  label: Turbo 加速
  family: minimax_h3
  default_enabled: false
  node: "105:200"
  bypass_input: model
  lora:
    field: inputs.lora_name
    options_from: loras
    match: minimax_h3
    recommended: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  strength:
    field: inputs.strength_model
    default: 1.0
    min: 0.5
    max: 1.5
  preset:
    steps: 8
requirements:
  nodes:
    - MiniMaxH3ImageToVideo
    - LoraLoaderModelOnly
    - SamplerCustomAdvanced
    - SaveVideo
    - CreateVideo
  models:
    - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    - text_encoders/qwen3vl_32b_heretic_minimax_h3_nvfp4.safetensors
    - vae/minimax_h3_video_vae_fp16.safetensors
    - vae/minimax_h3_audio_vae_fp32.safetensors
    - loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
