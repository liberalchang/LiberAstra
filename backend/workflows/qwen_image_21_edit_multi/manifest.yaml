name: qwen_image_21_edit_multi
capability: i2i
description: 'Qwen-Image 2.1 多图编辑（官方版，INT8）

  最多 4 张：第 1 张是主图（画布），第 2~4 张是参考；提示词里用 image 1 / image 2 … 指代各图。参数区可换模型三件套。'
inputs:
  image:
    node: '10'
    field: inputs.image
    type: image
    required: true
    label: 参考图 1（主图）
    mention: image 1
    description: 主图 / 画布（对应提示词 image 1）。合成时通常放第一张人物或底图
  image_2:
    node: '11'
    field: inputs.image
    type: image
    required: true
    label: 参考图 2
    mention: image 2
    description: 第二张参考（对应 image 2）。例如另一人物或要融合的元素
  image_3:
    node: '12'
    field: inputs.image
    type: image
    required: false
    label: 参考图 3（可选）
    mention: image 3
    description: 可选第三张参考（image 3）
  image_4:
    node: '13'
    field: inputs.image
    type: image
    required: false
    label: 参考图 4（可选）
    mention: image 4
    description: 可选第四张参考（image 4）
  unet_name:
    node: '1'
    field: inputs.unet_name
    type: str
    default: qwen_image_2.1_int8_convrot.safetensors
    options_from: diffusion_models
    label: 主模型（UNET）
    description: '默认官方 int8_convrot。可换 bf16 或越狱 UC（如 qwen-image-2.1-UC-int8_convrot.safetensors）。
      须为 safetensors。

      '
  clip_name:
    node: '2'
    field: inputs.clip_name
    type: str
    default: qwen3vl_8b_int8_convrot.safetensors
    options_from: text_encoders
    label: 文本编码器
    description: Qwen-Image 用 qwen3vl_8b；CLIPLoader type 保持 qwen_image
  vae_name:
    node: '3'
    field: inputs.vae_name
    type: str
    default: qwen_image_2.1_vae_bf16.safetensors
    options_from: vae
    label: VAE
  prompt:
    node: '5'
    field: inputs.prompt
    type: str
    required: true
    description: '编辑指令，按槽位指代图片，例如： 将 image 1 中的女性和 image 2 中的男性合成到同一张自然合影，统一光照与景深

      '
  negative_prompt:
    node: '5'
    field: inputs.negative_prompt
    type: str
    default: ''
  resolution:
    node: '5'
    field: inputs.resolution
    type: int
    default: 1024
    min: 0
    max: 4096
    description: 参考图缩放到大约这个边长（32 倍数）。0 表示尽量保留各图自身尺寸；画布尺寸跟从 image 1
  steps:
    node: '6'
    field: inputs.steps
    type: int
    default: 25
    min: 1
    max: 50
  seed:
    node: '6'
    field: inputs.seed
    type: int
    default: -1
outputs:
  node: '8'
  key: images
requirements:
  nodes:
  - UNETLoader
  - CLIPLoader
  - VAELoader
  - QwenImage21Cache
  - LoadImage
  - TextEncodeQwenImage21
  - KSampler
  - VAEDecode
  - SaveImage
  models:
  - diffusion_models/qwen_image_2.1_int8_convrot.safetensors
  - text_encoders/qwen3vl_8b_int8_convrot.safetensors
  - vae/qwen_image_2.1_vae_bf16.safetensors
llm_note: '事实:Qwen-Image 2.1 多参考编辑,最多 4 张:image_1 为主图/画布,image_2~4 为参考。

  写作指导:提示词里用 image 1 / image 2 … 显式指代每张图的角色与合成关系。'
