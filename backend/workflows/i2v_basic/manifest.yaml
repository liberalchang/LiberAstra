name: i2v_basic
capability: first_frame_i2v
description: Wan 系图生视频模板（首帧驱动）。需按本地 Wan 模型与 VideoHelperSuite 节点调整
inputs:
  image:
    node: "10"
    field: inputs.image
    type: image
    required: true
    description: 首帧图片
  prompt:
    node: "11"
    field: inputs.text
    type: str
    required: true
  negative_prompt:
    node: "12"
    field: inputs.text
    type: str
    default: ""
  ckpt_name:
    node: "20"
    field: inputs.ckpt_name
    type: str
    default: wan2.2_i2v.safetensors
  width:
    node: "30"
    field: inputs.width
    type: int
    default: 832
  height:
    node: "30"
    field: inputs.height
    type: int
    default: 480
  length:
    node: "30"
    field: inputs.length
    type: int
    default: 81
    description: 帧数
  steps:
    node: "40"
    field: inputs.steps
    type: int
    default: 20
  seed:
    node: "40"
    field: inputs.seed
    type: int
    default: -1
outputs:
  node: "60"
  key: gifs
requirements:
  nodes: [LoadImage, CLIPTextEncode, CheckpointLoaderSimple, WanImageToVideo, KSampler, VAEDecode, VHS_VideoCombine]
  models: ["checkpoints/wan2.2_i2v.safetensors"]
  note: 需要 VideoHelperSuite（VHS_VideoCombine）；WanImageToVideo 输入名以本地节点为准
